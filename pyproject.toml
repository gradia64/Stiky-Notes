[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stiky-notes"
version = "0.3.2"
description = "Sticky notes (post-it) on the KDE Plasma desktop"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Stiky-notes Developers" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: X11 Applications",
    "Topic :: Utilities",
]
dependencies = [
    "pyqt6>=6.0.0",
    "pyqt6-sip>=6.0.0",
]

[project.scripts]
stiky-notes = "kde_plasma_stiky_notes.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kde_plasma_stiky_notes"]

[tool.hatch.build.targets.sdist]
include = [
    "src/kde_plasma_stiky_notes/*.py",
    "src/kde_plasma_stiky_notes/**/*.py",
    "src/kde_plasma_stiky_notes/qml/**/*.qml",
    "src/kde_plasma_stiky_notes/qml/**/*.js",
    "src/kde_plasma_stiky_notes/qml/**/*.json",
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.isort]
profile = "black"
known-first-party = ["kde_plasma_stiky_notes"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true