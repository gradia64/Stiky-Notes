<?xml version="1.0" encoding="UTF-8"?>
<!-- Icona di Stiky-notes: post-it giallo con barra superiore, righe di testo
     e angolo piegato, davanti a un secondo post-it azzurro inclinato. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FB3F2"/>
      <stop offset="1" stop-color="#3D86D6"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE45C"/>
      <stop offset="1" stop-color="#FFCF2E"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5C518"/>
      <stop offset="1" stop-color="#EDB80E"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0A800"/>
      <stop offset="1" stop-color="#FFE98A"/>
    </linearGradient>
  </defs>

  <!-- Post-it azzurro dietro, inclinato -->
  <g transform="rotate(-11 118 132)">
    <rect x="36" y="56" width="164" height="164" rx="10" fill="#000000" fill-opacity="0.10" transform="translate(3 6)"/>
    <rect x="36" y="56" width="164" height="164" rx="10" fill="url(#back)"/>
    <rect x="36" y="56" width="164" height="26" rx="10" fill="#2F74C0" fill-opacity="0.35"/>
  </g>

  <!-- Ombra del post-it giallo -->
  <path d="M66 46 H226 Q234 46 234 54 V178 L186 226 H66 Q58 226 58 218 V54 Q58 46 66 46 Z"
        fill="#000000" fill-opacity="0.16" transform="translate(4 7)"/>

  <!-- Post-it giallo -->
  <path d="M66 46 H226 Q234 46 234 54 V178 L186 226 H66 Q58 226 58 218 V54 Q58 46 66 46 Z"
        fill="url(#paper)"/>

  <!-- Barra superiore, come nelle note dell'app -->
  <path d="M66 46 H226 Q234 46 234 54 V76 H58 V54 Q58 46 66 46 Z" fill="url(#band)"/>
  <circle cx="200" cy="61" r="4.5" fill="#8A6A00" fill-opacity="0.45"/>
  <circle cx="216" cy="61" r="4.5" fill="#8A6A00" fill-opacity="0.45"/>

  <!-- Righe di testo -->
  <rect x="80" y="100" width="128" height="10" rx="5" fill="#8A6A00" fill-opacity="0.50"/>
  <rect x="80" y="128" width="110" height="10" rx="5" fill="#8A6A00" fill-opacity="0.50"/>
  <rect x="80" y="156" width="86" height="10" rx="5" fill="#8A6A00" fill-opacity="0.50"/>
  <rect x="80" y="184" width="54" height="10" rx="5" fill="#8A6A00" fill-opacity="0.50"/>

  <!-- Angolo piegato -->
  <path d="M234 178 L186 226 L186 190 Q186 178 198 178 Z" fill="url(#fold)"/>
  <path d="M234 178 L186 226" stroke="#C99400" stroke-opacity="0.35" stroke-width="2"/>
</svg>
